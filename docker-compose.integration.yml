# Integration stack for THIS module's datastore-backed suites.
#
# `go test ./...` alone is unit coverage: every live suite auto-skips without
# its datastore environment variables (infrastructure/testenv). This stack
# provides the real Postgres, KurrentDB, Meilisearch and NATS those suites
# need, and script/integration-test.sh runs the suite with
# BUILDINGBLOCKS_REQUIRE_INTEGRATION=1 so a skip is a FAILURE — a job that
# provisioned the services cannot report green without exercising them.
#
# Usage (the script wraps all of this):
#   docker compose -f docker-compose.integration.yml up -d postgres kurrentdb meilisearch nats
#   docker compose -f docker-compose.integration.yml run --rm --no-deps migrate
#   BUILDINGBLOCKS_REQUIRE_INTEGRATION=1 go test ./... -count=1
#   docker compose -f docker-compose.integration.yml down --remove-orphans --volumes
#
# Every image is a PUBLIC Docker Hub image pinned to a concrete tag, because
# this repository's CI runs on GitHub-hosted runners with no access to any
# private registry. The tags mirror the versions the suites are written
# against (the pinned golang-migrate release matches go.mod).
#
# All datastores publish their standard ports on the host so the test process
# (which runs on the host, not in a container) reaches them on 127.0.0.1 with
# the module's own default URLs. Data directories are tmpfs, so a container
# restart always starts from a clean slate — repeat runs cannot inherit stale
# streams, indexes or rows.

name: buildingblocks-integration

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s

  # Applies the module's embedded shared migration SQL (the SAME files the
  # embedded fs.FS ships, mounted from disk so the ledger is built by the real
  # golang-migrate runner a consumer would use). The suites read
  # es_snapshots / es_projection_dlq / es_projection_checkpoints /
  # command_idempotency / sagas / attachments / nats_published_positions, so a
  # stack without this step fails on "relation does not exist".
  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infrastructure/postgres/shared/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://app:app@postgres:5432/app?sslmode=disable"
      - "up"

  kurrentdb:
    image: kurrentplatform/kurrentdb:26.0.3
    environment:
      KURRENTDB_CLUSTER_SIZE: "1"
      KURRENTDB_RUN_PROJECTIONS: "All"
      KURRENTDB_START_STANDARD_PROJECTIONS: "true"
      KURRENTDB_INSECURE: "true"
      KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP: "true"
      KURRENTDB_DB: "/var/lib/kurrentdb"
      KURRENTDB_LOG: "/var/log/kurrentdb"
    ports:
      - "2113:2113"
    # Ephemeral: the data dir is wiped on container exit, so every run starts
    # from an empty $all and the suites' unique stream prefixes never collide
    # with a previous run's leftovers.
    tmpfs:
      - /var/lib/kurrentdb
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2113/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  meilisearch:
    image: getmeili/meilisearch:v1.55.0
    environment:
      # The module's client falls back to this key when MEILISEARCH_API_KEY is
      # unset, so the stack and the suites agree without extra wiring.
      MEILI_MASTER_KEY: dev-meili-master-key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7700/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  nats:
    image: nats:2.11-alpine
    # -js: JetStream, required by the natspub and natsadapter live suites.
    # -m 8222: the monitoring endpoint the readiness probe uses (the image is
    # minimal, so there is no in-container healthcheck).
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    tmpfs:
      - /data
